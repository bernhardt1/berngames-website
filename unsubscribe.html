<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Release updates | Bern Games</title><link rel="stylesheet" href="/styles.css"></head><body><div class="page"><header class="site-header container"><a class="logo" href="/">Bern Games</a></header><main class="page-main container"><div class="panel"><h1>Leave the release list</h1><p>Stop receiving new-game emails from BernGames.</p><form id="unsubscribe"><button class="pill-button" type="submit">Unsubscribe</button><p id="status" role="status"></p></form><a class="inline-link" href="/">Back to the games</a></div></main></div><script>
document.getElementById('unsubscribe').addEventListener('submit',async event=>{event.preventDefault();const button=event.target.querySelector('button'),status=document.getElementById('status');button.disabled=true;try{const r=await fetch('/api/unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:location.hash.slice(1)}),signal:AbortSignal.timeout(8000)});const result=await r.json();if(!r.ok)throw Error(result.error);status.textContent='You have been unsubscribed.';history.replaceState(null,'',location.pathname);}catch(e){status.textContent=e.message??'Please try again later.';button.disabled=false;}});
</script></body></html>
